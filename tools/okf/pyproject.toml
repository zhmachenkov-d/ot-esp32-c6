[project]
name = "okf"
version = "0.1.0"
description = "OKF knowledge-bundle tooling for this repo"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
okf = "okf.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
