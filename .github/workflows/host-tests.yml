# Continuous host-unit-test signal on main. Not a release/tag gate.
name: Host tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Manifest generator self-test
        shell: bash
        run: bash .github/scripts/generate-ota-manifest.sh --self-test

      - name: Release tag gate self-test
        shell: bash
        run: bash .github/scripts/check-release-tag.sh --self-test

      - name: Run host unit tests
        shell: bash
        run: |
          set -euo pipefail
          . /opt/esp/idf/export.sh
          cd firmware/tests/host
          ./run.sh
